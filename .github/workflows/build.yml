
name: Build ForestPedestrians

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile Android Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q ForestPedestrians-GitHub.zip -d .

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          local-cache: true

      - name: Build ARM64
        run: |
          ndk-build \
            NDK_PROJECT_PATH=ForestPedestrians \
            APP_BUILD_SCRIPT=ForestPedestrians/Android.mk \
            NDK_APPLICATION_MK=ForestPedestrians/Application.mk \
            NDK_DEBUG=0 \
            -j2

      - name: Package plugin
        run: |
          mkdir -p release
          cp ForestPedestrians/libs/arm64-v8a/libForestPedestrians.so release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForestPedestrians-arm64
          path: release/*
